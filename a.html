<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리의 이야기 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: linear-gradient(160deg, #fff8f0 0%, #fdf2f8 50%, #f0f4ff 100%);
  font-family: 'Noto Serif KR', serif;
  overflow-x: hidden;
}
#petals-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.petal { position: absolute; opacity: 0; pointer-events: none; animation: petalFall linear; }
@keyframes petalFall {
  0%   { opacity: 0; transform: translateY(-20px) rotate(0deg); }
  10%  { opacity: 0.7; }
  90%  { opacity: 0.5; }
  100% { opacity: 0; transform: translateY(110vh) rotate(360deg); }
}
.status-banner {
  position: fixed; top: 0; left: 0; right: 0;
  background: #757575; color: white;
  text-align: center; font-size: 0.75rem;
  padding: 6px; z-index: 100; letter-spacing: 0.05em;
  transition: background 0.3s;
}

.screen { display: none; padding: 2.5rem 0.8rem; position: relative; z-index: 1; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; }
.screen.active { display: flex; }
.main-title { font-family: 'Playfair Display', serif; font-style: italic; font-size: 2.2rem; color: #c0647a; text-align: center; margin-bottom: 0.3rem; margin-top: 1.5rem; }
.main-subtitle { font-size: 0.8rem; color: #a07090; text-align: center; letter-spacing: 0.12em; margin-bottom: 2.5rem; }
.envelope-row { display: flex; gap: 1.4rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem; }
.envelope-card { width: 140px; cursor: pointer; text-align: center; transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1); position: relative; }
.envelope-card:hover { transform: translateY(-7px) scale(1.05); }
.envelope-card.locked { opacity: 0.55; }
.envelope-card.locked .env-img-wrap svg { filter: grayscale(0.8); }
.envelope-card.done .env-img-wrap svg { filter: hue-rotate(320deg) saturate(0.8); }
.env-img-wrap { width: 130px; height: 92px; margin: 0 auto 0.6rem; position: relative; }
.env-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5rem; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.12)); pointer-events: none; }
.env-check-badge { position: absolute; top: -6px; right: -2px; background: #66bb6a; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
.env-date { font-size: 0.72rem; color: #a07090; margin-bottom: 0.15rem; }
.env-label { font-size: 0.78rem; color: #c0647a; font-weight: 600; }
.date-note { font-size: 0.75rem; color: #b090a0; text-align: center; line-height: 1.9; max-width: 280px; }
#screen-reveal { background: linear-gradient(160deg, #fff0f5 0%, #fdf6ff 100%); }
.reveal-anim { animation: revealIn 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
@keyframes revealIn { from { opacity: 0; transform: scale(0.72) translateY(24px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.reveal-day-badge { background: #c0647a; color: white; font-size: 0.72rem; padding: 5px 16px; border-radius: 20px; margin-bottom: 1.2rem; letter-spacing: 0.1em; }

.letter-card { background: white; border: 1px solid #f0d0da; border-radius: 18px; padding: 1.8rem 1.4rem; width: 100%; max-width: 440px; box-shadow: 0 8px 36px rgba(192,100,122,0.12); position: relative; }
.letter-card::before { content: '❝'; font-family: 'Playfair Display', serif; font-size: 3rem; color: #f0d0da; position: absolute; top: 0.5rem; left: 1rem; line-height: 1; }
.letter-title { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.2rem; color: #c0647a; text-align: center; margin-bottom: 1rem; padding-top: 0.6rem; }
.letter-body { font-size: 0.86rem; color: #5a3545; line-height: 2.1; text-align: center; white-space: pre-line; }

#reveal-extra { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; }
.video-wrap { 
  width: 100%; 
  margin-top: 1.2rem; 
  border-radius: 14px; 
  overflow: hidden; 
  box-shadow: 0 6px 24px rgba(192,100,122,0.15); 
  aspect-ratio: 16 / 10.5; 
  position: relative; 
  background: #000; 
}
.video-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

.photo-placeholder { width: 100%; max-width: 440px; height: 180px; background: linear-gradient(135deg, #fde8ef, #f3e8fd); border-radius: 14px; border: 2px dashed #e8b4c0; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 1.2rem; cursor: pointer; overflow: hidden; transition: background 0.2s; }
.photo-placeholder:hover { background: linear-gradient(135deg, #fbd5e3, #ead5fb); }
.photo-placeholder img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
.photo-label { font-size: 0.75rem; color: #c0a0b0; margin-top: 0.5rem; }
.photo-icon { font-size: 1.8rem; margin-bottom: 0.3rem; }
input[type="file"] { display: none; }
.reveal-btn { margin-top: 1.6rem; padding: 0.65rem 2.2rem; background: linear-gradient(135deg, #e87a9a, #c0647a); color: white; border: none; border-radius: 30px; font-family: 'Noto Serif KR', serif; font-size: 0.85rem; cursor: pointer; letter-spacing: 0.06em; transition: opacity 0.2s; }
.reveal-btn:hover { opacity: 0.85; }
.reset-btn { background: none; border: 1px dashed #d0a0b0; color: #b08090; border-radius: 20px; padding: 5px 16px; font-size: 0.72rem; cursor: pointer; margin-top: 0.8rem; font-family: 'Noto Serif KR', serif; }
.ending-glow { font-family: 'Playfair Display', serif; font-style: italic; font-size: 2rem; color: #c0647a; text-align: center; line-height: 1.5; margin-bottom: 1rem; animation: gentlePulse 2.5s ease-in-out infinite; }
@keyframes gentlePulse { 0%,100%{opacity:1;} 50%{opacity:0.65;} }
.ending-msg { font-size: 0.85rem; color: #a07090; text-align: center; line-height: 2.1; max-width: 300px; margin-bottom: 1.5rem; }
.hearts-row { font-size: 1.6rem; letter-spacing: 0.5rem; margin-bottom: 1.5rem; animation: heartBeat 1.8s ease-in-out infinite; }
@keyframes heartBeat { 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }

.admin-wrap { margin-top: 1.5rem; display: flex; gap: 0.5rem; justify-content: center; align-items: center; }
.admin-input { padding: 0.4rem; border-radius: 20px; border: 1px solid #d0a0b0; text-align: center; width: 110px; font-family: inherit; font-size: 0.75rem; outline: none; }
.admin-btn { background: #c0647a; color: white; border: none; border-radius: 20px; padding: 6px 14px; font-size: 0.75rem; cursor: pointer; font-family: inherit; transition: opacity 0.2s; }
.admin-btn:hover { opacity: 0.8; }
</style>
</head>
<body>

<div class="status-banner" id="status-banner">🔒 날짜별 잠금 모드 작동 중</div>
<div id="petals-container"></div>

<div id="screen-main" class="screen active">
  <div class="main-title">우리의 이야기</div>
  <div class="main-subtitle">✦ &nbsp; Our Love Story &nbsp; ✦</div>
  <div class="envelope-row" id="envelope-row"></div>
  <div class="date-note" id="date-note">탭해서 봉투를 열어보세요 💌</div>
  
  <button class="reset-btn" onclick="resetAll()">🔄 처음부터 다시 보기</button>

  <div class="admin-wrap" id="admin-area">
    <input type="password" id="admin-pw" class="admin-input" placeholder="비밀번호">
    <button class="admin-btn" onclick="checkAdmin()">잠금 해제</button>
  </div>
</div>

<div id="screen-reveal" class="screen">
  <div class="reveal-day-badge" id="reveal-badge"></div>
  <div class="letter-card reveal-anim">
    <div class="letter-title" id="letter-title"></div>
    <div class="letter-body" id="letter-body"></div>
  </div>
  <div id="reveal-extra"></div>
  <button class="reveal-btn" onclick="showMain()">봉투 목록으로 →</button>
</div>

<div id="screen-ending" class="screen">
  <div class="hearts-row">🌸 💗 🌸</div>
  <div class="ending-glow">사랑해요,<br>영원히</div>
  <div class="ending-msg">세 개의 봉투를 모두 열었어요 💌<br>우리가 함께한 모든 순간이<br>세상에서 가장 소중한 이야기예요.</div>
  <div class="hearts-row">✨ 💍 ✨</div>
  <button class="reveal-btn" onclick="showMain()">처음으로 돌아가기</button>
</div>

<script>
const ENVELOPE_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <rect x="20" y="60" width="360" height="200" rx="12" fill="#fff0f5" stroke="#e8b4c8" stroke-width="2"/>
  <path d="M20,60 L200,160 L380,60" fill="#f9ccd8" stroke="#e8b4c8" stroke-width="2"/>
  <circle cx="200" cy="160" r="28" fill="#e87a9a"/>
  <path d="M200 168 C200 168 185 157 185 150 C185 145 190 142 195 145 C197 146 199 148 200 150 C201 148 203 146 205 145 C210 142 215 145 215 150 C215 157 200 168 200 168Z" fill="white" opacity="0.95"/>
</svg>`;

const ENVELOPE_DATA = [
  {
    day: "5월 31일 (D-2)",
    label: "D-2",
    letterTitle: "사랑합니다.",
    letterBody: "결혼기념일 마다 이렇게 여행을 다녀서\n특별한 날이 되는것 같아!\n\n지난 14년도에는 2주년 결혼기념일 영상을 만들었네! 꽤 오래동안 만들었던, 힘들었던 기억이 ㅋㅋ \n\n우선 이영상 다시 보고있어!\n결혼기념일 D-2 후훗",
    extra: "video",
    videoId: "1XoQbcseFy8Yd6M84vrhBkwIH6SRyWSxD"
  },
  {
    day: "6월 1일 (D-1)",
    label: "D-1",
    letterTitle: "건강합시다.",
    letterBody: "그동안 행복했던 시간이 참 많았네.\n 아래 영상은 1년 전 결혼기념일에 일본 갔을 때!\n \n앞으로도 이렇게 오래오래 행복하게 살려면 일단 건강이 최고다 ㅋㅋ\n\n우리 모두 건강 잘 챙기고,\n 앞으로도 재미있게 살아보자~\n\n사랑해 ❤️",
    extra: "video",
    videoId: "1vunvyMVDk_d_9o62Tuyc-Bh5lkvvk9ge"
  },
  {
    day: "6월 2일 (D-Day) ✦",
    label: "기념일 💍",
    letterTitle: "오늘, 우리의 날 💗",
    letterBody: "오늘 이 날을 기억해요?\n\n우리 같이 찍은 사진도 정말 많네.\n 내가 정리하려고 했는데, 이미 여보 휴대폰에 예쁘게 잘 정리되어 있더라 ㅋㅋ\n\n사진들을 보니까 그동안 참 행복한 시간이 많았다는 생각이 들어.\n앞으로도 우리 가족 3명,\n 지금처럼 건강하게, 행복하게,\n 여기저기 많이 여행 다니며 좋은 추억 가득 만들자!\n\n앞으로도 쭉, 우리 함께해요.\n\n사랑해요 ❤️",
    extra: "gif",
    gifId: "1KspjP91q3OprR2J0zd743QMUscpJKFyB"
  }
];

const PETALS = ['🌸','🌺','✿','❀','🌷','💮'];
let completedDays = [];
let isAdmin = false;

try { completedDays = JSON.parse(localStorage.getItem('ann_test_done') || '[]'); } catch(e){}

function isAvailable(index) {
  if (isAdmin) return true;
  const now = new Date();
  const targetDates = [
    new Date(2026, 4, 31), 
    new Date(2026, 5, 1),  
    new Date(2026, 5, 2)   
  ];
  return now >= targetDates[index];
}

function checkAdmin() {
  const pw = document.getElementById('admin-pw').value;
  if (pw === '1234') {
    isAdmin = true;
    alert('🔓 잠금이 해제되었습니다.');
    const banner = document.getElementById('status-banner');
    banner.textContent = '🔓 관리자 모드 — 모든 봉투 열림';
    banner.style.background = '#4caf50';
    document.getElementById('admin-area').style.display = 'none';
    renderMain();
  } else {
    alert('❌ 비밀번호가 올바르지 않습니다.');
  }
}

function saveDone(i) {
  if (!completedDays.includes(i)) completedDays.push(i);
  try { localStorage.setItem('ann_test_done', JSON.stringify(completedDays)); } catch(e){}
}

function resetAll() {
  completedDays = [];
  try { localStorage.removeItem('ann_test_done'); } catch(e){}
  renderMain();
}

function renderMain() {
  const row = document.getElementById('envelope-row');
  row.innerHTML = '';
  ENVELOPE_DATA.forEach((d, i) => {
    const done = completedDays.includes(i);
    const available = isAvailable(i);

    const card = document.createElement('div');
    card.className = 'envelope-card' + (done ? ' done' : '') + (!available ? ' locked' : '');
    
    let overlayIcon = '💌';
    if (done) overlayIcon = '✅';
    else if (!available) overlayIcon = '🔒';

    card.innerHTML =
      '<div class="env-img-wrap">' +
        ENVELOPE_SVG +
        '<span class="env-overlay">' + overlayIcon + '</span>' +
        (done ? '<div class="env-check-badge">✓</div>' : '') +
      '</div>' +
      '<div class="env-date">' + d.day + '</div>' +
      '<div class="env-label">' + d.label + '</div>';
    
    card.onclick = () => {
      if (isAvailable(i)) {
        showReveal(i);
      } else {
        alert('💝 아직 열 수 없는 봉투입니다!\n' + d.day + '에 자동으로 공개됩니다.');
      }
    };
    row.appendChild(card);
  });

  const allDone = completedDays.length >= ENVELOPE_DATA.length;
  const note = document.getElementById('date-note');
  note.innerHTML = allDone
    ? '세 개의 봉투를 모두 열었어요 💗<br><button onclick="showEnding()" style="background:none;border:none;color:#c0647a;cursor:pointer;font-family:inherit;font-size:0.8rem;text-decoration:underline;margin-top:0.4rem;">엔딩 보기 ✨</button>'
    : '탭해서 봉투를 열어보세요 💌';
}

function showMain() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-main').classList.add('active');
  renderMain();
}

function showReveal(i) {
  saveDone(i);
  const d = ENVELOPE_DATA[i];
  document.getElementById('reveal-badge').textContent = d.label + ' 열림 ✦';
  document.getElementById('letter-title').textContent = d.letterTitle;
  document.getElementById('letter-body').textContent = d.letterBody;

  const extra = document.getElementById('reveal-extra');
  extra.innerHTML = '';

  if (d.extra === 'video' && d.videoId) {
    extra.innerHTML =
      '<div class="video-wrap">' +
        '<iframe src="https://drive.google.com/file/d/' + d.videoId + '/preview" allowfullscreen></iframe>' +
      '</div>' +
      '<div style="margin-top: 14px; text-align: center;">' +
        '<a href="https://drive.google.com/file/d/' + d.videoId + '/view?usp=drivesdk" target="_blank" style="color: #c0647a; font-size: 0.8rem; text-decoration: underline;">🔗 영상 원본 링크 열기</a>' +
      '</div>';
 } else if (d.extra === 'gif' && d.gifId) {
    extra.innerHTML =
      '<div style="width: 100%; margin-top: 1.2rem; display: flex; justify-content: center;">' +
        '<img src="https://drive.google.com/uc?export=view&id=' + d.gifId + '" style="width: 100%; max-width: 440px; border-radius: 14px; box-shadow: 0 6px 24px rgba(192,100,122,0.15);" alt="움직이는 추억" />' +
      '</div>';
  } else if (d.extra === 'photo') {
    let saved = null;
    try { saved = localStorage.getItem('ann_test_photo_' + i); } catch(e){}
    const label = document.createElement('label');
    label.className = 'photo-placeholder';
    label.setAttribute('for', 'photo-upload-' + i);
    label.innerHTML = saved
      ? '<img src="' + saved + '" />'
      : '<span class="photo-icon">📷</span><span class="photo-label">사진을 추가하려면 탭하세요</span>';
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*'; input.id = 'photo-upload-' + i;
    input.onchange = function(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        try { localStorage.setItem('ann_test_photo_' + i, ev.target.result); } catch(e){}
        label.innerHTML = '<img src="' + ev.target.result + '" />';
      };
      reader.readAsDataURL(file);
    };
    extra.appendChild(label);
    extra.appendChild(input);
  }

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-reveal').classList.add('active');
}

function showEnding() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-ending').classList.add('active');
}

function spawnPetal() {
  const c = document.getElementById('petals-container');
  const p = document.createElement('div');
  p.className = 'petal';
  p.textContent = PETALS[Math.floor(Math.random() * PETALS.length)];
  p.style.left = Math.random() * 100 + '%';
  const dur = 5 + Math.random() * 5;
  const delay = Math.random() * 3;
  p.style.animation = 'petalFall ' + dur + 's ' + delay + 's linear';
  p.style.fontSize = (10 + Math.random() * 9) + 'px';
  c.appendChild(p);
  setTimeout(() => { if (p.parentNode) p.parentNode.removeChild(p); }, (dur + delay + 1) * 1000);
}
for (let i = 0; i < 14; i++) setTimeout(spawnPetal, i * 500);
setInterval(spawnPetal, 1100);

renderMain();
</script>
</body>
</html>
