<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리의 이야기 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: linear-gradient(160deg, #fff8f0 0%, #fdf2f8 50%, #f0f4ff 100%);
  font-family: 'Noto Serif KR', serif;
  overflow-x: hidden;
}
#petals-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.petal { position: absolute; opacity: 0; pointer-events: none; animation: petalFall linear; }
@keyframes petalFall {
  0%   { opacity: 0; transform: translateY(-20px) rotate(0deg); }
  10%  { opacity: 0.7; }
  90%  { opacity: 0.5; }
  100% { opacity: 0; transform: translateY(110vh) rotate(360deg); }
}
.test-banner {
  position: fixed; top: 0; left: 0; right: 0;
  background: #757575; color: white;
  text-align: center; font-size: 0.75rem;
  padding: 6px; z-index: 100; letter-spacing: 0.05em;
  transition: background 0.3s;
}
.screen { display: none; padding: 2.5rem 1.5rem; position: relative; z-index: 1; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; }
.screen.active { display: flex; }
.main-title { font-family: 'Playfair Display', serif; font-style: italic; font-size: 2.2rem; color: #c0647a; text-align: center; margin-bottom: 0.3rem; margin-top: 1.5rem; }
.main-subtitle { font-size: 0.8rem; color: #a07090; text-align: center; letter-spacing: 0.12em; margin-bottom: 2.5rem; }
.envelope-row { display: flex; gap: 1.4rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem; }
.envelope-card { width: 140px; cursor: pointer; text-align: center; transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1); position: relative; }
.envelope-card:hover { transform: translateY(-7px) scale(1.05); }
.envelope-card.done .env-img-wrap img { filter: hue-rotate(100deg) saturate(0.6); }
.envelope-card.locked { opacity: 0.6; }
.envelope-card.locked .env-img-wrap img { filter: grayscale(0.6) contrast(0.8); }
.env-img-wrap { width: 130px; height: 92px; margin: 0 auto 0.6rem; position: relative; }
.env-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
.env-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5rem; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.12)); }
.env-check-badge { position: absolute; top: -6px; right: -2px; background: #66bb6a; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
.env-date { font-size: 0.72rem; color: #a07090; margin-bottom: 0.15rem; }
.env-label { font-size: 0.78rem; color: #c0647a; font-weight: 600; }
.date-note { font-size: 0.75rem; color: #b090a0; text-align: center; line-height: 1.9; max-width: 280px; }
#screen-reveal { background: linear-gradient(160deg, #fff0f5 0%, #fdf6ff 100%); }
.reveal-anim { animation: revealIn 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
@keyframes revealIn { from { opacity: 0; transform: scale(0.72) translateY(24px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.reveal-day-badge { background: #c0647a; color: white; font-size: 0.72rem; padding: 5px 16px; border-radius: 20px; margin-bottom: 1.2rem; letter-spacing: 0.1em; }
.letter-card { background: white; border: 1px solid #f0d0da; border-radius: 18px; padding: 1.8rem 1.6rem; width: 100%; max-width: 380px; box-shadow: 0 8px 36px rgba(192,100,122,0.12); position: relative; }
.letter-card::before { content: '❝'; font-family: 'Playfair Display', serif; font-size: 3rem; color: #f0d0da; position: absolute; top: 0.5rem; left: 1rem; line-height: 1; }
.letter-title { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.2rem; color: #c0647a; text-align: center; margin-bottom: 1rem; padding-top: 0.6rem; }
.letter-body { font-size: 0.86rem; color: #5a3545; line-height: 2.1; text-align: center; white-space: pre-line; }
.video-wrap { width: 100%; max-width: 380px; margin-top: 1.2rem; border-radius: 14px; overflow: hidden; box-shadow: 0 6px 24px rgba(192,100,122,0.15); }
.video-wrap iframe { width: 100%; height: 213px; border: none; display: block; }
.photo-placeholder { width: 100%; max-width: 380px; height: 170px; background: linear-gradient(135deg, #fde8ef, #f3e8fd); border-radius: 14px; border: 2px dashed #e8b4c0; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 1.2rem; cursor: pointer; overflow: hidden; transition: background 0.2s; }
.photo-placeholder:hover { background: linear-gradient(135deg, #fbd5e3, #ead5fb); }
.photo-placeholder img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
.photo-label { font-size: 0.75rem; color: #c0a0b0; margin-top: 0.5rem; }
.photo-icon { font-size: 1.8rem; margin-bottom: 0.3rem; }
input[type="file"] { display: none; }
.reveal-btn { margin-top: 1.6rem; padding: 0.65rem 2.2rem; background: linear-gradient(135deg, #e87a9a, #c0647a); color: white; border: none; border-radius: 30px; font-family: 'Noto Serif KR', serif; font-size: 0.85rem; cursor: pointer; letter-spacing: 0.06em; transition: opacity 0.2s; }
.reveal-btn:hover { opacity: 0.85; }
.reset-btn { background: none; border: 1px dashed #d0a0b0; color: #b08090; border-radius: 20px; padding: 5px 16px; font-size: 0.72rem; cursor: pointer; margin-top: 0.8rem; font-family: 'Noto Serif KR', serif; }
.ending-glow { font-family: 'Playfair Display', serif; font-style: italic; font-size: 2rem; color: #c0647a; text-align: center; line-height: 1.5; margin-bottom: 1rem; animation: gentlePulse 2.5s ease-in-out infinite; }
@keyframes gentlePulse { 0%,100%{opacity:1;} 50%{opacity:0.65;} }
.ending-msg { font-size: 0.85rem; color: #a07090; text-align: center; line-height: 2.1; max-width: 300px; margin-bottom: 1.5rem; }
.hearts-row { font-size: 1.6rem; letter-spacing: 0.5rem; margin-bottom: 1.5rem; animation: heartBeat 1.8s ease-in-out infinite; }
@keyframes heartBeat { 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }

/* 🔒 관리자 모드 스타일 */
.admin-wrap { margin-top: 1.5rem; display: flex; gap: 0.4rem; align-items: center; justify-content: center; }
.admin-input { padding: 0.45rem 0.8rem; border: 1px solid #d0a0b0; border-radius: 20px; font-family: inherit; font-size: 0.75rem; text-align: center; width: 110px; outline: none; }
.admin-btn { background: #c0647a; color: white; border: none; border-radius: 20px; padding: 6px 14px; font-size: 0.75rem; cursor: pointer; font-family: inherit; transition: background 0.2s; }
.admin-btn:hover { background: #e87a9a; }
</style>
</head>
<body>

<div class="test-banner" id="status-banner">🔒 날짜별 잠금 모드 작동 중</div>
<div id="petals-container"></div>

<div id="screen-main" class="screen active">
  <div class="main-title">우리의 이야기</div>
  <div class="main-subtitle">✦ &nbsp; Our Love Story &nbsp; ✦</div>
  <div class="envelope-row" id="envelope-row"></div>
  <div class="date-note" id="date-note">탭해서 봉투를 열어보세요 💌</div>
  <button class="reset-btn" onclick="resetAll()">🔄 처음부터 다시 보기</button>
  
  <div class="admin-wrap" id="admin-area">
    <input type="password" id="admin-pw" class="admin-input" placeholder="관리자 비밀번호">
    <button class="admin-btn" onclick="checkAdmin()">잠금 해제</button>
  </div>
</div>

<div id="screen-reveal" class="screen">
  <div class="reveal-day-badge" id="reveal-badge"></div>
  <div class="letter-card reveal-anim">
    <div class="letter-title" id="letter-title"></div>
    <div class="letter-body" id="letter-body"></div>
  </div>
  <div id="reveal-extra"></div>
  <button class="reveal-btn" onclick="showMain()">봉투 목록으로 →</button>
</div>

<div id="screen-ending" class="screen">
  <div class="hearts-row">🌸 💗 🌸</div>
  <div class="ending-glow">사랑해요,<br>영원히</div>
  <div class="ending-msg">세 개의 봉투를 모두 열었어요 💌<br>우리가 함께한 모든 순간이<br>세상에서 가장 소중한 이야기예요.</div>
  <div class="hearts-row">✨ 💍 ✨</div>
  <button class="reveal-btn" onclick="showMain()">처음으로 돌아가기</button>
</div>
